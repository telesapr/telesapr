<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeleSAPR</title>
<style>
	html, body { margin: 0; height: 100%; background: #2b2b2b; }
	#loading { position: fixed; inset: 0; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center;
		background: #2b2b2b; color: #e8e8e8; font: 15px system-ui, sans-serif; gap: 14px; }
	#loading h1 { margin: 0; font-weight: 600; letter-spacing: .04em; }
	#bar { width: min(360px, 70vw); height: 6px; border-radius: 3px; background: #444; overflow: hidden; }
	#bar > div { height: 100%; width: 0; background: #5b9bff; transition: width .15s; }
	#bar.indeterminate > div { width: 30%; animation: slide 1.1s ease-in-out infinite alternate; }
	@keyframes slide { from { margin-left: 0 } to { margin-left: 70% } }
	#status { font-size: 13px; color: #aaa; min-height: 1.4em; text-align: center; max-width: 80vw; }
</style>
</head>
<body>
<div id="loading">
	<h1>TeleSAPR</h1>
	<div id="bar"><div></div></div>
	<div id="status">Loading...</div>
	<noscript>TeleSAPR needs JavaScript and WebAssembly.</noscript>
</div>
<!-- memfs.js first: wasm_exec.js keeps a globalThis.fs that is already there. -->
<script src="memfs.js"></script>
<script src="wasm_exec.js"></script>
<script>
"use strict";
// ?model=<url>   opens that model (a .tlspr, same origin or with CORS) once the editor is up.
// ?wasm=<url>    the program (default telesapr-web.wasm).
const params = new URLSearchParams(location.search);
const loading = document.getElementById("loading");
const bar = document.getElementById("bar");
const status = document.getElementById("status");
const say = (s) => { status.textContent = s; };
const t0 = performance.now();
const stamp = () => ((performance.now() - t0) / 1000).toFixed(1) + " s";

// fetchWithProgress streams the program through a counter, so the page
// shows how much has come while the browser compiles it as it arrives.
async function fetchWithProgress(url) {
	const res = await fetch(url);
	if (!res.ok) throw new Error(url + ": " + res.status + " " + res.statusText);
	const total = Number(res.headers.get("Content-Length")) || 0;
	const encoded = res.headers.get("Content-Encoding");
	let got = 0;
	const reader = res.body.getReader();
	const stream = new ReadableStream({
		async pull(ctl) {
			const { done, value } = await reader.read();
			if (done) { ctl.close(); return; }
			got += value.length;
			// With a compressed transfer the bytes counted are the
			// decoded ones, more than Content-Length says.
			if (total && !encoded && got <= total) {
				bar.firstChild.style.width = (100 * got / total).toFixed(1) + "%";
				say("Loading the program: " + (got / 1048576).toFixed(1) + " of " + (total / 1048576).toFixed(1) + " MB");
			} else {
				bar.classList.add("indeterminate");
				say("Loading the program: " + (got / 1048576).toFixed(1) + " MB");
			}
			ctl.enqueue(value);
		},
		cancel(r) { return reader.cancel(r); },
	});
	return new Response(stream, { headers: { "Content-Type": "application/wasm" } });
}

globalThis.telesaprReady = async () => {
	loading.remove();
	console.log("telesapr: editor ready after " + stamp());
	const model = params.get("model");
	if (model) {
		try {
			const res = await fetch(model);
			if (!res.ok) throw new Error(res.status + " " + res.statusText);
			const name = decodeURIComponent(new URL(res.url).pathname.split("/").pop()) || "model.tlspr";
			memfs.put("/home/user/" + name, new Uint8Array(await res.arrayBuffer()));
			const err = await telesaprOpen("/home/user/" + name);
			if (err) console.warn("telesapr: could not open " + model + ": " + err);
		} catch (e) {
			console.warn("telesapr: could not load " + model + ": " + e);
		}
	}
};

(async () => {
	try {
		say("Reading your files...");
		await memfs.mount();
		const go = new Go();
		// Home is where the files of a user are, and what Go's os
		// package finds the settings and the script history under.
		go.env = { HOME: "/home/user", TERM: "xterm" };
		say("Loading the program...");
		const wasm = await WebAssembly.instantiateStreaming(await fetchWithProgress(params.get("wasm") || "telesapr-web.wasm"), go.importObject);
		bar.classList.add("indeterminate");
		say("Starting...");
		console.log("telesapr: program compiled after " + stamp());
		await go.run(wasm.instance);
		console.log("telesapr: program ended");
	} catch (e) {
		bar.classList.remove("indeterminate");
		say("TeleSAPR could not start: " + e);
		console.error("telesapr: " + (e && e.stack || e));
	}
})();
</script>
</body>
</html>
