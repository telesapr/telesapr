version: "2"

run:
  timeout: 10m

linters:
  # errcheck, govet, ineffassign, staticcheck and unused.
  default: standard
  settings:
    errcheck:
      # What a command, help() or a test's recording prints to its
      # output: a failed write has nowhere else to be reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    staticcheck:
      checks:
        # golangci-lint's default set.
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # The errors that the interface shows the user in a message box
        # are sentences, capitalised and punctuated, as C++'s were.
        - -ST1005
        # De Morgan's law, and if-else chains as switches: the
        # conditions keep the shape of the C++ or the C they were
        # ported from, where they can be checked against it.
        - -QF1001
        - -QF1003
