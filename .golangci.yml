version: "2"

run:
  timeout: 20m

linters:
  # errcheck, govet, ineffassign, staticcheck and unused, and:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - intrange
    - modernize
  settings:
    errcheck:
      # What a command, help() or a test's recording prints to its
      # output: a failed write has nowhere else to be reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      # golangci-lint's default set of revive's rules, but for
      # unused-parameter: the parameters of a callback or an
      # interface's method are part of its signature whether a given
      # implementation reads them or not.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
    unparam:
      check-exported: false
    modernize:
      # embedlit's rewrite of a literal that sets a promoted field
      # through its embedded struct does not compile.
      disable:
        - embedlit
    staticcheck:
      checks:
        # golangci-lint's default set.
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # De Morgan's law applied by rote reads worse than the
        # negation of what is meant.
        - -QF1001

  exclusions:
    rules:
      # A test's helper takes the fixed arguments its cases share.
      - path: _test\.go
        linters:
          - unparam
      # The example scripts run in yaegi, which has no range over a
      # function or an integer, so they keep the older forms.
      - path: ^examples/
        linters:
          - intrange
          - modernize

formatters:
  enable:
    - gofmt
    - goimports
