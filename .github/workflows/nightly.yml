# What is too slow, or changes too little from commit to commit, for
# every push: the vulnerability report as a job that fails, the
# robustness sweeps over their whole grids, the fuzz targets, every
# benchmark once, the race detector over pkg/ui and pkg/script/api, and
# the quick tests on Windows.
# Each step is a make target, so any of it runs locally the same way.
#
# On a schedule it runs only when master moved since the last nightly
# run that passed; asked for by hand (workflow_dispatch), on any branch,
# it always runs. A failure mails whoever the repository's notification
# settings name, as any failed run does.
name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  X11_PACKAGES: libx11-dev libxft-dev libfontconfig1-dev libgl-dev

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo run=true >>"$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w Nightly -s success -L 1 --json headSha -q '.[0].headSha')
          echo "master is $GITHUB_SHA; the last nightly run that passed was on ${last:-none}"
          if [ "$last" = "$GITHUB_SHA" ]; then echo run=false; else echo run=true; fi >>"$GITHUB_OUTPUT"

  vuln:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install X11 development packages
        run: sudo apt-get update && sudo apt-get install -y $X11_PACKAGES
      - name: govulncheck
        run: make vuln

  deep:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sweeps
            target: test-sweeps
          - name: fuzz
            target: fuzz FUZZTIME=5m
          - name: bench
            target: bench
          - name: race-ui-api
            target: test-race RACE_PACKAGES='./pkg/ui ./pkg/script/api' RACE_TIMEOUT=90m
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/cache@v5
        with:
          path: .gocache
          key: gocache-nightly-${{ matrix.name }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-nightly-${{ matrix.name }}-${{ hashFiles('go.sum') }}-
            gocache-nightly-${{ matrix.name }}-
      - name: Install X11 development packages
        run: sudo apt-get update && sudo apt-get install -y $X11_PACKAGES
      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }} 2>&1 | tee nightly-${{ matrix.name }}.txt
        shell: bash -o pipefail {0}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-${{ matrix.name }}
          path: nightly-${{ matrix.name }}.txt
      # What a fuzz target found, as go test wrote it under testdata/fuzz:
      # copied into the repository, it becomes a test case.
      - uses: actions/upload-artifact@v7
        if: failure() && matrix.name == 'fuzz'
        with:
          name: fuzz-failures
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  windows:
    # The quick tests (make test-fast) on Windows, without those
    # scripts/os-skip/windows.txt lists: some fifteen minutes, most of it
    # compiling, too long for every push to master. GNU make is not on
    # the runner's PATH, so the script runs directly, in Git Bash.
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Git for Windows checks text files out with CRLF line endings,
      # and the goldens are compared byte for byte.
      - name: LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Quick tests
        shell: bash
        run: scripts/test-os.sh
