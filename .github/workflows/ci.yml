# Every push to a branch: the checks, the quick tests (make test-fast),
# the lint and the vulnerability report, as jobs side by side. On a push
# to master, and on request (workflow_dispatch) for a branch, every test
# in place of the quick ones (make test and make test-heavy, on a runner
# each), and the race detector in shards: make ci,
# run before a merge, is the same locally, so a branch gets its answer in
# minutes and master still checks it all. The nightly workflow
# (nightly.yml) runs what is too slow or costs too many minutes for
# every push: the coverage rule, and the quick tests on Windows and macOS
# among it.
#
# A tag push runs nothing here: make release tags a commit of master
# that this workflow has passed, and release.yml runs on the tag. There
# is no pull_request trigger: the repository takes no pull requests from
# forks, and a pull request's commits are pushes to a branch, which run.
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes the run before it; a run
# asked for by hand is a group of its own, so it neither cancels nor
# waits for the push's.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  X11_PACKAGES: libx11-dev libxft-dev libfontconfig1-dev libgl-dev

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The Makefile builds into .gocache, which setup-go's cache of
      # the default build directory never sees; each job keeps its own,
      # saved on every run and restored from the newest run before it.
      - uses: actions/cache@v5
        with:
          path: .gocache
          key: gocache-checks-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-checks-${{ hashFiles('go.sum') }}-
            gocache-checks-
      - name: Install X11 development packages
        run: sudo apt-get update && sudo apt-get install -y $X11_PACKAGES
      - name: gofmt, go.mod tidy, generated symbols up to date, build
        run: make checks

  vuln:
    # govulncheck fails when an advisory is published against the
    # standard library or a dependency, with no commit at all: here it
    # only warns, so that master does not turn red for it. The nightly
    # and Release workflows run it as a job that fails.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/cache@v5
        with:
          path: .gocache
          key: gocache-vuln-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-vuln-${{ hashFiles('go.sum') }}-
            gocache-vuln-
      - name: Install X11 development packages
        run: sudo apt-get update && sudo apt-get install -y $X11_PACKAGES
      - name: govulncheck
        run: make vuln

  quick:
    # A branch's tests: those that skip themselves under testing.Short
    # are the slow ones, which master and make ci run.
    if: github.ref != 'refs/heads/master' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/cache@v5
        with:
          path: .gocache
          key: gocache-quick-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-quick-${{ hashFiles('go.sum') }}-
            gocache-quick-
      - name: Install X11 development packages
        run: sudo apt-get update && sudo apt-get install -y $X11_PACKAGES
      - name: Quick tests
        run: make test-fast

  tests:
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/cache@v5
        with:
          path: .gocache
          key: gocache-tests-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-tests-${{ hashFiles('go.sum') }}-
            gocache-tests-
      - name: Install X11 development packages, Xvfb and a font
        run: sudo apt-get update && sudo apt-get install -y $X11_PACKAGES xvfb fonts-dejavu-core
      # Every test but the heavy ones, the GUI ones under Xvfb.
      - name: Tests
        run: make test

  # The heavy tests (HEAVY in scripts/go-test.sh) on a runner of their own,
  # beside tests: make test is the rest, and make ci runs both.
  heavy:
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/cache@v5
        with:
          path: .gocache
          key: gocache-heavy-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-heavy-${{ hashFiles('go.sum') }}-
            gocache-heavy-
      - name: Install X11 development packages, Xvfb and a font
        run: sudo apt-get update && sudo apt-get install -y $X11_PACKAGES xvfb fonts-dejavu-core
      - name: Heavy tests
        run: make test-heavy

  lint:
    # The whole tree, which is lint-clean since 2026-10-03, with the
    # golangci-lint that tools/lint/go.mod pins, as make lint runs it
    # locally. govet is in the set.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/lint/go.sum
      - uses: actions/cache@v5
        with:
          path: |
            .gocache
            .golangci-lint
          key: lint-${{ hashFiles('go.sum', 'tools/lint/go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ hashFiles('go.sum', 'tools/lint/go.sum', '.golangci.yml') }}-
            lint-
      - name: Install X11 development packages
        run: sudo apt-get update && sudo apt-get install -y $X11_PACKAGES
      - name: golangci-lint
        run: make lint

  race:
    # The engine packages under the race detector, about eight times
    # slower than the plain run: on master, where make release waits
    # for it, and on request. scripts/go-test.sh runs the slow packages
    # as several processes, and the shards take about the same time;
    # with the build cache, a package no commit touched since the last
    # run is a cached result. pkg/ui and pkg/script/api run under the
    # detector in the nightly workflow.
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sketch
            packages: ./pkg/sketch/...
          - name: topo
            packages: ./pkg/topo ./pkg/thread ./pkg/ttf
          # check has a runner of its own: beside topo, the two took the
          # shard past go test's 30 minutes on a slow runner.
          - name: check
            packages: ./pkg/check
          - name: kernel
            packages: >-
              ./pkg/srf/... ./pkg/solver/... ./pkg/persist/convert ./pkg/persist/slvs
              ./pkg/persist/dxf ./pkg/persist/link ./pkg/persist/step ./pkg/persist/tlspr
              ./pkg/script ./pkg/script/agent ./pkg/mcpserver ./pkg/platform/... ./pkg/render
              ./pkg/render/soft ./cmd/... ./pkg/core ./pkg/geom ./pkg/libm ./pkg/internal/...
              ./pkg/res
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/cache@v5
        with:
          path: .gocache
          key: gocache-race-${{ matrix.name }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-race-${{ matrix.name }}-${{ hashFiles('go.sum') }}-
            gocache-race-${{ matrix.name }}-
      - name: Install X11 development packages
        run: sudo apt-get update && sudo apt-get install -y $X11_PACKAGES
      - name: Race detector, shard ${{ matrix.name }}
        run: make test-race RACE_PACKAGES='${{ matrix.packages }}'
