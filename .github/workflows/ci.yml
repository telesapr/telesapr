name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  X11_PACKAGES: libx11-dev libxft-dev libfontconfig1-dev libgl-dev

jobs:
  test:
    runs-on: ubuntu-latest
    # The race run of pkg/persist alone takes over ten minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install X11 development packages, Xvfb and a font
        run: sudo apt-get update && sudo apt-get install -y $X11_PACKAGES xvfb fonts-dejavu-core
      - name: gofmt
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: go.mod and go.sum are tidy
        run: make tidy-check
      - name: Build
        run: make build
      - name: Generated script symbols are up to date
        run: make generate-check
      - name: Tests, with coverage
        run: make coverage
      - name: Race detector on the engine packages
        run: make test-race
      - name: GUI tests under Xvfb
        run: make test-gui
      - name: Known vulnerabilities reachable from the binaries
        run: make vuln
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  lint:
    # The whole tree, which is lint-clean since 2026-10-03.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install X11 development packages
        run: sudo apt-get update && sudo apt-get install -y $X11_PACKAGES
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
