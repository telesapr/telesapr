name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # takigo is private: go fetches it from GitHub using TAKIGO_TOKEN,
  # a token with read access to its contents.
  GOPRIVATE: github.com/takigo/takigo
  X11_PACKAGES: libx11-dev libxft-dev libfontconfig1-dev libgl-dev

jobs:
  test:
    runs-on: ubuntu-latest
    # The race run of pkg/persist alone takes over ten minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Let go fetch the private takigo
        run: git config --global url."https://x-access-token:${{ secrets.TAKIGO_TOKEN }}@github.com/".insteadOf https://github.com/
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install X11 development packages, Xvfb and a font
        run: sudo apt-get update && sudo apt-get install -y $X11_PACKAGES xvfb fonts-dejavu-core
      - name: gofmt
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Build
        run: make build
      - name: Generated script symbols are up to date
        run: make generate-check
      - name: Tests, with coverage
        run: make coverage
      - name: Race detector on the engine packages
        run: make test-race
      - name: GUI tests under Xvfb
        run: make test-gui
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    # The whole tree, which is lint-clean since 2026-10-03.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Let go fetch the private takigo
        run: git config --global url."https://x-access-token:${{ secrets.TAKIGO_TOKEN }}@github.com/".insteadOf https://github.com/
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install X11 development packages
        run: sudo apt-get update && sudo apt-get install -y $X11_PACKAGES
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
