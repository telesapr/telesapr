# Every push to a branch: the checks, the tests with coverage, the lint
# and the vulnerability report, as jobs side by side. On a push to master,
# and on request (workflow_dispatch) for a branch, also the race detector
# in shards. make ci runs it locally; the nightly workflow (nightly.yml)
# runs what is too slow for every push.
#
# A tag push runs nothing here: make release tags a commit of master
# that this workflow has passed, and release.yml runs on the tag. There
# is no pull_request trigger: the repository takes no pull requests from
# forks, and a pull request's commits are pushes to a branch, which run.
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes the run before it; a run
# asked for by hand is a group of its own, so it neither cancels nor
# waits for the push's.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  X11_PACKAGES: libx11-dev libxft-dev libfontconfig1-dev libgl-dev

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The Makefile builds into .gocache, which setup-go's cache of
      # the default build directory never sees; each job keeps its own,
      # saved on every run and restored from the newest run before it.
      - uses: actions/cache@v5
        with:
          path: .gocache
          key: gocache-checks-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-checks-${{ hashFiles('go.sum') }}-
            gocache-checks-
      # The packages and what they depend on come from a cache rather
      # than from the mirror on every run.
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.X11_PACKAGES }}
          version: x11-1
      - name: gofmt, go.mod tidy, generated symbols up to date, build
        run: make checks

  vuln:
    # govulncheck fails when an advisory is published against the
    # standard library or a dependency, with no commit at all: here it
    # only warns, so that master does not turn red for it. The nightly
    # and Release workflows run it as a job that fails.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/cache@v5
        with:
          path: .gocache
          key: gocache-vuln-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-vuln-${{ hashFiles('go.sum') }}-
            gocache-vuln-
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.X11_PACKAGES }}
          version: x11-1
      - name: govulncheck
        run: make vuln

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/cache@v5
        with:
          path: .gocache
          key: gocache-coverage-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-coverage-${{ hashFiles('go.sum') }}-
            gocache-coverage-
      # Xvfb for the GUI tests, and a font for what they draw; the
      # font's install script builds fontconfig's cache.
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.X11_PACKAGES }} xvfb fonts-dejavu-core
          version: x11-xvfb-1
          execute_install_scripts: true
      # Every test, the GUI ones under Xvfb, with the 85% rule.
      - name: Tests, with coverage
        run: make coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  lint:
    # The whole tree, which is lint-clean since 2026-10-03, with the
    # golangci-lint that tools/lint/go.mod pins, as make lint runs it
    # locally. govet is in the set.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/lint/go.sum
      - uses: actions/cache@v5
        with:
          path: |
            .gocache
            .golangci-lint
          key: lint-${{ hashFiles('go.sum', 'tools/lint/go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ hashFiles('go.sum', 'tools/lint/go.sum', '.golangci.yml') }}-
            lint-
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.X11_PACKAGES }}
          version: x11-1
      - name: golangci-lint
        run: make lint

  race:
    # The engine packages under the race detector, about eight times
    # slower than the plain run: on master, where make release waits
    # for it, and on request. The shards take about the same CPU time
    # each; with the build cache, a package no commit touched since the
    # last run is a cached result.
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: slvs
            packages: ./pkg/persist/slvs
          - name: topo
            packages: ./pkg/topo ./pkg/thread ./pkg/ttf ./pkg/check
          - name: kernel
            packages: >-
              ./pkg/srf/... ./pkg/sketch/... ./pkg/solver/... ./pkg/persist/convert
              ./pkg/persist/dxf ./pkg/persist/link ./pkg/persist/step ./pkg/persist/tlspr
              ./pkg/script ./pkg/script/agent ./pkg/mcpserver ./pkg/platform/... ./pkg/render
              ./pkg/render/soft ./cmd/... ./pkg/core ./pkg/geom ./pkg/libm ./pkg/internal/...
              ./pkg/res
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/cache@v5
        with:
          path: .gocache
          key: gocache-race-${{ matrix.name }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-race-${{ matrix.name }}-${{ hashFiles('go.sum') }}-
            gocache-race-${{ matrix.name }}-
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.X11_PACKAGES }}
          version: x11-1
      - name: Race detector, shard ${{ matrix.name }}
        run: make test-race RACE_PACKAGES='${{ matrix.packages }}'
